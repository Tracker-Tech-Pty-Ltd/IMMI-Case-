name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly full E2E run. 15:30 UTC is ~02:30 in Australia/Sydney, i.e. after
  # the working day for this project's only operator.
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: ubuntu-latest
    # The 3.14 leg is advisory until it has had one green run; promote it to a
    # blocking leg (delete this line) once it is proven on ubuntu-latest.
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        # 3.12 matches the extraction container image (Dockerfile line 4,
        # `FROM python:3.12-slim`); 3.14 matches the local .venv developers run.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-app.txt
            requirements-test.txt
            constraints.txt

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -c constraints.txt -r requirements-app.txt -r requirements-test.txt

      - name: Lint with ruff
        run: .venv/bin/ruff check immi_case_downloader/ scripts/ tests/ *.py

      # The two bundle/reference --ignore entries below shell out to node/esbuild and
      # need worker node_modules, which this job does not install; the test-worker job
      # runs the same checks directly ("Verify Cloudflare-native bundle closure",
      # "Verify effective native references"). They still run locally via make test-py.
      - name: Run Python unit tests
        run: >-
          .venv/bin/pytest
          tests/
          -q --timeout=120
          --ignore=tests/e2e
          --ignore=tests/integration
          --ignore=tests/test_cloudflare_native_bundle.py
          --ignore=tests/test_native_effective_references.py

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript typecheck (build mode)
        working-directory: frontend
        run: |
          set -euo pipefail
          npx tsc -b --noEmit --force --listFiles | tee /tmp/tsc-listfiles.txt

      - name: Assert the typecheck is not vacuous
        working-directory: frontend
        run: |
          set -euo pipefail
          src=$(grep -c '/frontend/src/' /tmp/tsc-listfiles.txt || true)
          tests=$(grep -c '/frontend/__tests__/' /tmp/tsc-listfiles.txt || true)
          echo "typechecked $src files under frontend/src/, $tests under frontend/__tests__/"
          if [ "$src" -lt 150 ]; then
            echo "::error::TypeScript project graph collapsed: only $src files under src/ were typechecked (expected >= 150)."
            exit 1
          fi
          if [ "$tests" -lt 50 ]; then
            echo "::error::TypeScript project graph collapsed: only $tests files under __tests__/ were typechecked (expected >= 50). Check that tsconfig.test.json is still referenced from tsconfig.json."
            exit 1
          fi

      - name: Assert the tsconfig project graph is intact
        working-directory: frontend
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("tsconfig.json", "utf8").replace(/^\s*\/\/.*$/gm, "");
            const cfg = JSON.parse(raw);
            const want = ["./tsconfig.app.json", "./tsconfig.node.json", "./tsconfig.test.json"];
            const got = (cfg.references || []).map(r => r.path).sort();
            const missing = want.filter(p => !got.includes(p));
            if (missing.length) {
              console.error("::error::tsconfig.json is missing project reference(s): " + missing.join(", "));
              process.exit(1);
            }
            if (cfg.compilerOptions) {
              console.error("::error::tsconfig.json must stay references-only; compilerOptions here causes TS5101.");
              process.exit(1);
            }
            console.log("tsconfig references OK: " + got.join(", "));
          '

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: Build production bundle
        run: npm run build:cloudflare
        working-directory: frontend

      - name: Assert the committed design tokens are not stale
        run: git diff --exit-code -- frontend/src/tokens/tokens.css frontend/src/tokens/tokens.ts

      - name: Run Vitest tests with coverage thresholds
        run: npx vitest run --coverage
        working-directory: frontend

  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            workers/austlii-scraper/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Test secret preflight parser
        run: bash scripts/test_preflight_secrets.sh

      - name: Verify effective native references
        run: python3 scripts/check_native_effective_references.py --json

      - name: Verify Cloudflare-native bundle closure
        run: node scripts/check_cloudflare_native_bundle.mjs

      - name: Run Cloudflare Worker tests
        run: npm run test:workers

      - name: Install native pipeline dependencies
        run: npm ci --ignore-scripts
        working-directory: workers/austlii-scraper

      - name: Typecheck native pipeline
        run: npm run typecheck
        working-directory: workers/austlii-scraper

      - name: Run native pipeline tests
        run: npm test
        working-directory: workers/austlii-scraper

  vitest-collection:
    # The three Vitest suites above each run `vitest run`, which reports success
    # for whatever its include glob happened to match. A narrowed glob therefore
    # produces a GREEN suite with a smaller test count and no error anywhere —
    # exactly how frontend/src/lib/__tests__/saved-searches.test.ts (28 tests)
    # stayed uncollected for as long as it did.
    #
    # `make check-vitest-collection` compares the SET of test files on disk with
    # the SET each config actually collects, so a dropped file is named rather
    # than inferred from a count. It needs all three node_modules trees at once,
    # which is why it is its own job: test-frontend installs only frontend/, and
    # test-worker installs only the root and workers/austlii-scraper.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            workers/austlii-scraper/package-lock.json

      - name: Install root (Worker suite) dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install native pipeline dependencies
        run: npm ci --ignore-scripts
        working-directory: workers/austlii-scraper

      - name: Assert every Vitest file on disk is collected exactly once
        run: make check-vitest-collection

  e2e-smoke:
    # Blocking PR gate. Runs the two E2E files proven green in plan 040 Step 3.
    # The Flask app is local-dev only (production is workers/cloudflare-native.js),
    # so this is a local-dev-parity gate, not a production gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python + E2E dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-app.txt -r requirements-test.txt -r requirements-e2e.txt

      - name: Install Playwright chromium
        run: .venv/bin/python -m playwright install --with-deps chromium

      # Build THIS PR's SPA over the committed bundle. Without this the Flask
      # fixture serves the bundle that was committed on main, so a frontend
      # regression in the PR cannot fail the E2E job.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Mark the pre-build state
        run: touch "$RUNNER_TEMP/pre-build-marker"

      - name: Build the SPA under test
        run: npm run build
        working-directory: frontend

      - name: Assert the served bundle is this PR's build
        run: |
          test -f immi_case_downloader/static/react/index.html
          # Fails if the build step is ever removed or silently no-ops: the
          # served directory must contain assets written AFTER the marker.
          if ! find immi_case_downloader/static/react -type f -newer "$RUNNER_TEMP/pre-build-marker" | grep -q .; then
            echo "::error::E2E would run against the committed bundle, not this PR's build"
            exit 1
          fi

      # tests/e2e/conftest.py launches Flask in-process on a free port with 10
      # seeded cases; no external server is required.
      - name: Run E2E smoke subset
        run: >-
          .venv/bin/pytest
          tests/e2e/test_smoke.py
          tests/e2e/react/test_react_smoke.py
          -q --no-cov --timeout=180

  e2e-nightly:
    # Full suite — too slow for every PR. Scheduled and manual only.
    # tests/e2e/playwright/ is excluded on purpose: test_council_thread_visual.py
    # defaults to E2E_BASE_URL=https://immi.trackit.today and makes real LLM calls
    # against production. It must never run from CI.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python + E2E dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-app.txt -r requirements-test.txt -r requirements-e2e.txt

      - name: Install Playwright chromium
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build the SPA under test
        run: npm run build
        working-directory: frontend

      - name: Run full E2E suite
        run: >-
          .venv/bin/pytest
          tests/e2e
          -q --no-cov --timeout=300
          --ignore=tests/e2e/playwright
