name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly full E2E run. 15:30 UTC is ~02:30 in Australia/Sydney, i.e. after
  # the working day for this project's only operator.
  schedule:
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # github.event_name is part of the key on purpose. Push, schedule and
  # workflow_dispatch all report github.ref as refs/heads/main, so a key of
  # ci-${{ github.ref }} alone put them in one cancellation group: a push to main
  # would kill the nightly E2E run mid-flight, and the nightly would kill a
  # running main CI. Same-kind runs on the same ref still supersede each other,
  # which is all cancel-in-progress was ever meant to do.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: ubuntu-latest
    # The 3.14 leg is advisory until it has had one green run; promote it to a
    # blocking leg (delete this line) once it is proven on ubuntu-latest.
    continue-on-error: ${{ matrix.python-version == '3.14' }}
    strategy:
      fail-fast: false
      matrix:
        # 3.12 matches the extraction container image (Dockerfile line 4,
        # `FROM python:3.12-slim`); 3.14 matches the local .venv developers run.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-app.txt
            requirements-test.txt
            constraints.txt

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -c constraints.txt -r requirements-app.txt -r requirements-test.txt

      - name: Lint with ruff
        run: .venv/bin/ruff check immi_case_downloader/ scripts/ tests/ *.py

      # The two bundle/reference --ignore entries below shell out to node/esbuild and
      # need worker node_modules, which this job does not install; the test-worker job
      # runs the same checks directly ("Verify Cloudflare-native bundle closure",
      # "Verify effective native references"). They still run locally via make test-py.
      - name: Run Python unit tests
        run: >-
          .venv/bin/pytest
          tests/
          -q --timeout=120
          --ignore=tests/e2e
          --ignore=tests/integration
          --ignore=tests/test_cloudflare_native_bundle.py
          --ignore=tests/test_native_effective_references.py

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The coverage-ratchet step below compares this commit's thresholds
          # against the ones they replaced, so it needs more than a shallow tip.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript typecheck (build mode)
        working-directory: frontend
        run: |
          set -euo pipefail
          npx tsc -b --noEmit --force --listFiles | tee /tmp/tsc-listfiles.txt

      - name: Assert the typecheck is not vacuous
        working-directory: frontend
        run: |
          set -euo pipefail
          src=$(grep -c '/frontend/src/' /tmp/tsc-listfiles.txt || true)
          echo "typechecked $src files under frontend/src/"
          if [ "$src" -lt 150 ]; then
            echo "::error::TypeScript project graph collapsed: only $src files under src/ were typechecked (expected >= 150)."
            exit 1
          fi

          # SETS, not a count. A ">= 50 files" floor is satisfied by plenty of
          # subsets: narrowing tsconfig.test.json's include to "*.test.tsx" drops
          # every .test.ts — including api-csrf-lifecycle.test.ts, the CSRF
          # lifecycle suite — and still clears 50 comfortably. Comparing sets
          # names the file that stopped being typechecked instead of inferring
          # that something might have.
          find __tests__ -type f \
            \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) \
            | sed 's|^|frontend/|' | sort -u > /tmp/tests-on-disk.txt
          grep -oE '/frontend/__tests__/[^[:space:]]+' /tmp/tsc-listfiles.txt \
            | sed 's|^.*/frontend/|frontend/|' \
            | grep -E '\.(test|spec)\.tsx?$' | sort -u > /tmp/tests-typechecked.txt

          echo "test files on disk: $(wc -l < /tmp/tests-on-disk.txt), typechecked: $(wc -l < /tmp/tests-typechecked.txt)"
          untyped=$(comm -23 /tmp/tests-on-disk.txt /tmp/tests-typechecked.txt)
          if [ -n "$untyped" ]; then
            echo "::error::these test files exist but were NOT typechecked — tsconfig.test.json include/references have drifted:"
            echo "$untyped"
            exit 1
          fi

      - name: Assert the tsconfig project graph is intact
        working-directory: frontend
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("tsconfig.json", "utf8").replace(/^\s*\/\/.*$/gm, "");
            const cfg = JSON.parse(raw);
            const want = ["./tsconfig.app.json", "./tsconfig.node.json", "./tsconfig.test.json"];
            const got = (cfg.references || []).map(r => r.path).sort();
            const missing = want.filter(p => !got.includes(p));
            if (missing.length) {
              console.error("::error::tsconfig.json is missing project reference(s): " + missing.join(", "));
              process.exit(1);
            }
            if (cfg.compilerOptions) {
              console.error("::error::tsconfig.json must stay references-only; compilerOptions here causes TS5101.");
              process.exit(1);
            }
            console.log("tsconfig references OK: " + got.join(", "));
          '

      - name: ESLint
        run: npm run lint
        working-directory: frontend

      - name: Build production bundle
        run: npm run build:cloudflare
        working-directory: frontend

      - name: Assert the committed design tokens are not stale
        run: git diff --exit-code -- frontend/src/tokens/tokens.css frontend/src/tokens/tokens.ts

      # Runs BEFORE the coverage suite: a lowered bar should fail immediately and
      # unambiguously, not be masked by whatever the suite then reports against
      # the lowered numbers.
      #
      # `thresholds` stops coverage falling below the floor. This stops the floor
      # itself being edited down in the same commit that breaks it — otherwise
      # the whole gate is one two-character diff away from disabled, and catching
      # it depends on a reviewer noticing.
      - name: Assert no coverage floor was lowered
        env:
          # Via env, never inlined into the script: a branch name is attacker-
          # influencable text and ${{ }} interpolation would splice it into the
          # shell.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            git fetch --quiet origin "$BASE_REF"
            BASE="origin/$BASE_REF"
          else
            BASE="HEAD~1"
          fi
          if ! git cat-file -e "$BASE:frontend/vitest.config.ts" 2>/dev/null; then
            echo "No frontend/vitest.config.ts at $BASE (first commit of the file); nothing to compare."
            exit 0
          fi
          git show "$BASE:frontend/vitest.config.ts" > "$RUNNER_TEMP/baseline-vitest.config.ts"
          node scripts/check_coverage_ratchet.mjs \
            "$RUNNER_TEMP/baseline-vitest.config.ts" \
            frontend/vitest.config.ts

      - name: Run Vitest tests with coverage thresholds
        run: npx vitest run --coverage
        working-directory: frontend

  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            workers/austlii-scraper/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Test secret preflight parser
        run: bash scripts/test_preflight_secrets.sh

      - name: Verify effective native references
        run: python3 scripts/check_native_effective_references.py --json

      - name: Verify Cloudflare-native bundle closure
        run: node scripts/check_cloudflare_native_bundle.mjs

      - name: Run Cloudflare Worker tests
        run: npm run test:workers

      # Captures the Worker's real SQL from the CURRENT source and replays it against
      # the real D1 schema in SQLite. Must run capture+verify in one step: a stale
      # capture would let a keep-list regression pass.
      - name: Run the SQL harness (capture + replay)
        run: npm run test:sql

      - name: Install native pipeline dependencies
        run: npm ci --ignore-scripts
        working-directory: workers/austlii-scraper

      - name: Typecheck native pipeline
        run: npm run typecheck
        working-directory: workers/austlii-scraper

      - name: Run native pipeline tests
        run: npm test
        working-directory: workers/austlii-scraper

  vitest-collection:
    # The three Vitest suites above each run `vitest run`, which reports success
    # for whatever its include glob happened to match. A narrowed glob therefore
    # produces a GREEN suite with a smaller test count and no error anywhere —
    # exactly how frontend/src/lib/__tests__/saved-searches.test.ts (28 tests)
    # stayed uncollected for as long as it did.
    #
    # `make check-vitest-collection` compares the SET of test files on disk with
    # the SET each config actually collects, so a dropped file is named rather
    # than inferred from a count. It needs all three node_modules trees at once,
    # which is why it is its own job: test-frontend installs only frontend/, and
    # test-worker installs only the root and workers/austlii-scraper.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            workers/austlii-scraper/package-lock.json

      - name: Install root (Worker suite) dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install native pipeline dependencies
        run: npm ci --ignore-scripts
        working-directory: workers/austlii-scraper

      - name: Assert every Vitest file on disk is collected exactly once
        run: make check-vitest-collection

  e2e-smoke:
    # Blocking PR gate. Runs the two E2E files proven green in plan 040 Step 3.
    # The Flask app is local-dev only (production is workers/cloudflare-native.js),
    # so this is a local-dev-parity gate, not a production gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python + E2E dependencies
        run: |
          python3 -m venv .venv
          # -c constraints.txt, like the unit job: without it the same commit
          # resolves a different Flask/pytest closure on different days and CI
          # fails for reasons no code change caused. NOTE: constraints.txt does
          # not yet pin the E2E closure itself (requirements-e2e.txt carries only
          # `pytest-playwright>=0.9.0`), so that package still floats — the
          # snapshot needs regenerating to cover it.
          .venv/bin/pip install --quiet -c constraints.txt -r requirements-app.txt -r requirements-test.txt -r requirements-e2e.txt

      - name: Install Playwright chromium
        run: .venv/bin/python -m playwright install --with-deps chromium

      # Build THIS PR's SPA over the committed bundle. Without this the Flask
      # fixture serves the bundle that was committed on main, so a frontend
      # regression in the PR cannot fail the E2E job.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Emptied, not just marked. "Some file is newer than the marker" passes
      # while a stale index.html sits next to one freshly written orphan, and the
      # smoke tests would then exercise the bundle committed on main. If the
      # directory starts empty, everything the tests load provably came from this
      # build.
      - name: Clear the served bundle and mark the pre-build state
        run: |
          set -euo pipefail
          rm -rf immi_case_downloader/static/react
          touch "$RUNNER_TEMP/pre-build-marker"

      - name: Build the SPA under test
        run: npm run build
        working-directory: frontend

      - name: Assert the served bundle is this PR's build
        run: |
          set -euo pipefail
          root=immi_case_downloader/static/react
          test -f "$root/index.html" || { echo "::error::no index.html was built"; exit 1; }
          [ -n "$(find "$root/index.html" -newer "$RUNNER_TEMP/pre-build-marker")" ] || {
            echo "::error::index.html predates the build; E2E would run against a stale bundle"
            exit 1
          }
          # Every local asset index.html references must exist and also postdate
          # the marker, so a partially-restored tree cannot masquerade as a build.
          missing=0
          for asset in $(grep -oE '(src|href)="/[^"]+"' "$root/index.html" \
                         | sed -E 's/.*="([^"]+)"/\1/' | sed 's|^/||' | sort -u); do
            path="$root/$asset"
            if [ ! -f "$path" ]; then
              echo "::error::index.html references $asset, which was not built"
              missing=1
            elif [ -z "$(find "$path" -newer "$RUNNER_TEMP/pre-build-marker")" ]; then
              echo "::error::$asset predates this build"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          echo "served bundle verified against this build"

      # tests/e2e/conftest.py launches Flask in-process on a free port with 10
      # seeded cases; no external server is required.
      - name: Run E2E smoke subset
        run: >-
          .venv/bin/pytest
          tests/e2e/test_smoke.py
          tests/e2e/react/test_react_smoke.py
          -q --no-cov --timeout=180

  e2e-nightly:
    # Full suite — too slow for every PR. Scheduled and manual only.
    # tests/e2e/playwright/ is excluded on purpose: test_council_thread_visual.py
    # defaults to E2E_BASE_URL=https://immi.trackit.today and makes real LLM calls
    # against production. It must never run from CI.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python + E2E dependencies
        run: |
          python3 -m venv .venv
          # -c constraints.txt, like the unit job: without it the same commit
          # resolves a different Flask/pytest closure on different days and CI
          # fails for reasons no code change caused. NOTE: constraints.txt does
          # not yet pin the E2E closure itself (requirements-e2e.txt carries only
          # `pytest-playwright>=0.9.0`), so that package still floats — the
          # snapshot needs regenerating to cover it.
          .venv/bin/pip install --quiet -c constraints.txt -r requirements-app.txt -r requirements-test.txt -r requirements-e2e.txt

      - name: Install Playwright chromium
        run: .venv/bin/python -m playwright install --with-deps chromium

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build the SPA under test
        run: npm run build
        working-directory: frontend

      - name: Run full E2E suite
        run: >-
          .venv/bin/pytest
          tests/e2e
          -q --no-cov --timeout=300
          --ignore=tests/e2e/playwright
