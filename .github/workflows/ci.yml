name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-test.txt -r requirements-legacy-rollback.txt

      - name: Run native migration and extraction tests
        run: >-
          .venv/bin/pytest
          tests/test_native_pipeline_boundary.py
          tests/test_cloudflare_native_target.py
          tests/test_export_immi_ndjson.py
          tests/test_transform_immi_snapshot.py
          tests/test_cloudflare_catalog_capacity.py
          tests/test_cloudflare_search_benchmark.py
          tests/test_cloudflare_performance.py
          tests/test_immi_activation_evidence.py
          tests/test_effective_native_ci.py
          tests/test_cloudflare_route_manifest.py
          tests/test_separation_preflight.py
          tests/test_native_dependency_closure.py
          -x --timeout=60 -q

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: TypeScript typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Run Vitest tests
        run: npx vitest run
        working-directory: frontend

  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Worker dependencies
        run: npm ci

      - name: Test secret preflight parser
        run: bash scripts/test_preflight_secrets.sh

      - name: Verify effective native references
        run: python3 scripts/check_native_effective_references.py --json

      - name: Verify Cloudflare-native bundle closure
        run: node scripts/check_cloudflare_native_bundle.mjs

      - name: Run Cloudflare Worker tests
        run: npm run test:workers

      - name: Install native pipeline dependencies
        run: npm ci --ignore-scripts
        working-directory: workers/austlii-scraper

      - name: Typecheck native pipeline
        run: npm run typecheck
        working-directory: workers/austlii-scraper

      - name: Run native pipeline tests
        run: npm test
        working-directory: workers/austlii-scraper
