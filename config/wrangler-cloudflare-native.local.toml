# Local-only migration harness. This file deliberately has no account IDs,
# remote bindings, secrets, custom-domain routes, or deploy target.
name = "immi-case-cloudflare-native-local"
main = "workers/cloudflare-native.js"
compatibility_date = "2026-08-10"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "IMMI_CATALOG_DB"
database_name = "immi-catalog-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../migrations/d1/catalog"

[[d1_databases]]
binding = "IMMI_ACCOUNT_DB"
database_name = "immi-account-local"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "../migrations/d1/account"

[[d1_databases]]
binding = "IMMI_OPS_DB"
database_name = "immi-ops-local"
database_id = "00000000-0000-0000-0000-000000000003"
migrations_dir = "../migrations/d1/ops"

[[r2_buckets]]
binding = "IMMI_CONTENT"
bucket_name = "immi-content-local"

[[vectorize]]
binding = "CASE_VECTORS"
index_name = "case-vectors-local"

[[queues.producers]]
binding = "PIPELINE_CONTROL_QUEUE"
queue = "immi-pipeline-control-queue-local"

[vars]
AUTH_ENABLED = "true"
IMMI_STORAGE_MODE = "cloudflare"
IMMI_CASE_MUTATIONS_ENABLED = "false"
