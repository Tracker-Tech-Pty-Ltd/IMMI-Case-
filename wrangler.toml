# Active IMMI production configuration: Cloudflare-native only.
#
# Resource IDs and secret values are deliberately placeholders in source
# control. The operator-only deploy workflow receives a fully populated copy
# through an approved environment secret and runs the native config gate first.
name = "immi-case-standalone"
main = "workers/cloudflare-native.js"
compatibility_date = "2026-08-10"
compatibility_flags = ["nodejs_compat"]

# Workers Static Assets: the built React SPA (`cd frontend && npm run build:cloudflare`
# → frontend/dist). `not_found_handling = "single-page-application"` serves index.html
# for client-side routes (/, /analytics, /cases/:id) that don't match a static file.
[assets]
directory = "./frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "IMMI_CATALOG_DB"
database_name = "immi-catalog"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations/d1/catalog"

[[d1_databases]]
binding = "IMMI_ACCOUNT_DB"
database_name = "immi-account"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "migrations/d1/account"

[[d1_databases]]
binding = "IMMI_OPS_DB"
database_name = "immi-ops"
database_id = "00000000-0000-0000-0000-000000000003"
migrations_dir = "migrations/d1/ops"

[[r2_buckets]]
binding = "IMMI_CONTENT"
bucket_name = "immi-content"

[[vectorize]]
binding = "CASE_VECTORS"
index_name = "case-vectors"

[[kv_namespaces]]
binding = "PIPELINE_KV"
id = "00000000-0000-0000-0000-000000000004"

[ai]
binding = "AI"

# Council routes fail closed without this binding (see
# workers/llm-council/cloudflare_handlers.js applyRateLimit): every Council POST
# spends paid CF AI Gateway credit, so "no limiter" must never mean "unlimited".
# 30 requests / 60s / IP. `period` accepts only 10 or 60.
[[ratelimits]]
name = "RL_COUNCIL_TURN"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Bulk export is the only route that returns thousands of case rows in one
# response. 5 requests / 60s / IP mirrors the Flask exporter's
# @rate_limit(5, 3600, scope="export-csv") intent at edge granularity.
# `period` accepts only 10 or 60.
[[ratelimits]]
name = "RL_EXPORT"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[[durable_objects.bindings]]
name = "AUTH_NONCE"
class_name = "AuthNonce"

[[durable_objects.bindings]]
name = "COUNCIL_SESSION"
class_name = "CouncilSessionDO"

[[durable_objects.bindings]]
name = "CASE_MUTATION_COORDINATOR"
class_name = "CaseMutationDO"

[[migrations]]
tag = "cloudflare-native-v1"
new_sqlite_classes = ["AuthNonce", "CouncilSessionDO"]

[[migrations]]
tag = "case-mutation-coordinator-v1"
new_sqlite_classes = ["CaseMutationDO"]

[[queues.producers]]
binding = "CASE_MUTATION_QUEUE"
queue = "immi-case-mutation-queue"

[[queues.producers]]
binding = "PIPELINE_CONTROL_QUEUE"
queue = "immi-pipeline-control-queue"

[[queues.consumers]]
queue = "immi-case-mutation-queue"
max_batch_size = 20
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "immi-case-mutation-dlq"

[[queues.consumers]]
queue = "immi-case-mutation-dlq"
max_batch_size = 20
max_batch_timeout = 5
max_retries = 3

[[routes]]
pattern = "immi.trackit.today"
custom_domain = true

[vars]
AUTH_ENABLED = "true"
IMMI_STORAGE_MODE = "cloudflare"
IMMI_CASE_MUTATIONS_ENABLED = "false"
CUTOVER_WRITE_FREEZE = "false"

# Operator-set secrets only; values never belong in this file:
# CSRF_SECRET, JWT_SECRET_CURRENT, JWT_SECRET_PREVIOUS, JWT_KID_CURRENT,
# JWT_KID_PREVIOUS, TELEGRAM_BOT_TOKEN, CF_AIG_TOKEN
